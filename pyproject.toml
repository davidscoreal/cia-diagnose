[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cia-diagnose"
version = "1.1.0"
description = "Holistic business intelligence engine — 11-dimension diagnosis via any LLM. Triple option (Paid/OSS/CIA)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "David Lopez", email = "steban@univercityaiconsult.tech" }]
keywords = ["mcp", "automation", "business", "audit", "consulting"]

dependencies = [
    "mcp>=1.0.0",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://univercityaiconsult.tech"
Repository = "https://github.com/davidscoreal/cia-diagnose"
Documentation = "https://github.com/davidscoreal/cia-diagnose#readme"

[project.optional-dependencies]
pdf = ["weasyprint>=62.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
cia-diagnose = "cia_diagnose.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cia_diagnose"]

# Ship brand assets and YAML benchmarks inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"brand" = "cia_diagnose/brand"

[tool.hatch.build]
artifacts = ["src/cia_diagnose/domain/diagnosis/benchmarks/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
