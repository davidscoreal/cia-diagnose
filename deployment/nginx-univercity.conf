# nginx reverse proxy for univercity-mcp
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/

upstream univercity_mcp {
    server 127.0.0.1:3792;
}

server {
    listen 80;
    server_name audit.univercityaiconsult.tech;

    # Redirect to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name audit.univercityaiconsult.tech;

    # SSL certs (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/audit.univercityaiconsult.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audit.univercityaiconsult.tech/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # MCP endpoint
    location / {
        proxy_pass http://univercity_mcp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Health check
    location /health {
        proxy_pass http://univercity_mcp;
    }
}
